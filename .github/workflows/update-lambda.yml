name: Trigger Lambda on GitHub Update

on:
  push:
    branches:
      - main
      - master

jobs:
  call-lambda:
    runs-on: ubuntu-latest
    steps:
      - name: Call API Gateway to trigger Lambda (with retry)
        run: |
          for i in 1 2 3; do
            echo "Attempt $i"
            curl -v -X POST "https://7kfyx1527c.execute-api.ap-northeast-1.amazonaws.com/default/screenshot" && break
            echo "Retrying in 5 seconds..."
            sleep 5
          done

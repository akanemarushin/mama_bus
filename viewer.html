<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>バスビューア</title>
<style>
  body {
    font-family: "M PLUS Rounded 1c", sans-serif;
    background: #f5f7ff;
    margin: 0;
    padding: 20px;
  }
#content {
  background: #ffffff;
  padding: 0;
  border-radius: 8px;
  box-shadow: none;
}
</style>
</head>

<body>
<div id="content">読み込み中...</div>

<script>
(async () => {
  // URL例:
  // viewer.html?json=https://cloudfront/komone.json&key=kantobus

  const params = new URLSearchParams(location.search);
  const jsonUrl = params.get("json");
  const key = params.get("key");

  if (!jsonUrl || !key) {
    document.getElementById("content").innerHTML =
      "<p style='color:red;'>json または key が指定されていません。</p>";
    return;
  }

  try {
    // JSON を取得
    const res = await fetch(jsonUrl + "?v=" + Date.now(), { cache: "no-store" });
    const data = await res.json();

    // 指定されたキーの HTML を表示
    if (data[key]) {
      document.getElementById("content").innerHTML = data[key];
    } else {
      document.getElementById("content").innerHTML =
        `<p style='color:red;'>指定されたキー「${key}」のデータがありません。</p>`;
    }
  } catch (e) {
    document.getElementById("content").innerHTML =
      "<p style='color:red;'>JSON の読み込みに失敗しました。</p>";
  }
})();
</script>

</body>
</html>

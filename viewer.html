<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>バスビューア</title>
<style>
  body {
    font-family: "M PLUS Rounded 1c", sans-serif;
    background: #f5f7ff;
    margin: 0;
    padding: 20px;
  }

  #content {
    background: #ffffff;
    padding: 0;
    border-radius: 8px;
    box-shadow: none;
  }

  /* ここから追加：路線ごとの文字サイズ調整 */
  body.kantobus-mode * {
    font-size: 1.1em !important;
    line-height: 1.1em !important;
  }

  body.tobus-mode * {
    font-size: 1.1em !important;
    line-height: 1.1em !important;
  }
  /* 追加ここまで */

</style>
</head>

<body>
<div id="content">読み込み中...</div>

<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const jsonUrl = params.get("json");
  const key = params.get("key");

  /* ここから追加：key に応じて body にクラスを付与 */
  if (key === "kantobus") {
    document.body.classList.add("kantobus-mode");
  }
  if (key === "tobus") {
    document.body.classList.add("tobus-mode");
  }
  /* 追加ここまで */

  if (!jsonUrl || !key) {
    document.getElementById("content").innerHTML =
      "<p style='color:red;'>json または key が指定されていません。</p>";
    return;
  }

  try {
    const res = await fetch(jsonUrl + "?v=" + Date.now(), { cache: "no-store" });
    const data = await res.json();

    if (data[key]) {
      document.getElementById("content").innerHTML = data[key];
    } else {
      document.getElementById("content").innerHTML =
        `<p style='color:red;'>指定されたキー「${key}」のデータがありません。</p>`;
    }
  } catch (e) {
    document.getElementById("content").innerHTML =
      "<p style='color:red;'>JSON の読み込みに失敗しました。</p>";
  }
})();
</script>

</body>
</html>

<div id="bus"></div>

<script>
async function loadBus() {
  const url = "https://bus-screenshot-akane.s3.ap-northeast-1.amazonaws.com/latest.json";
  const res = await fetch(url);
  const data = await res.json();

  const box = document.getElementById("bus");
  box.innerHTML = "";

  data.forEach(line => {
    const div = document.createElement("div");
    div.textContent = line;
    box.appendChild(div);
  });
}

// 初回読み込み
loadBus();

// 1分ごとに更新
setInterval(loadBus, 60000);
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>mama_bus</title>

<style>
.group-up {
  border: 4px solid #8ea6ff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 32px;
}

.group-down {
  border: 4px solid #ffb38e;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 32px;
}

iframe {
  margin-bottom: 20px;
  width: 100%;
  height: 800px;
  border: none;
  overflow: hidden;
}

#update-time {
  font-size: 20px;
  margin: 10px 0;
}

#reload-btn {
  padding: 10px 20px;
  background: #4a7aff;
  color: white;
  border-radius: 8px;
  cursor: pointer;
  font-size: 18px;
  border: none;
}
</style>
</head>

<body>

<h1>mama_bus</h1>

<!-- 更新ボタン -->
<button id="reload-btn">最新の情報に更新</button>

<!-- 更新時刻 -->
<div id="update-time">更新時刻: 読み込み中...</div>

<script>
// 更新時刻を読み込む
async function loadUpdateTime() {
  const url = "https://bus-screenshot-akane.s3.ap-northeast-1.amazonaws.com/last_update.json?v=" + Date.now();
  const res = await fetch(url, { cache: "no-store" });
  const json = await res.json();

  const ts = new Date(json.timestamp).toLocaleString("ja-JP");
  document.getElementById("update-time").textContent = "更新時刻: " + ts;
}

// 最新の情報に更新ボタン
document.getElementById("reload-btn").onclick = () => {
  location.reload();
};

// 1分ごとに自動更新
setInterval(() => {
  location.reload();
}, 60000);

// 初回読み込み
loadUpdateTime();
</script>

<!-- ========================= -->
<!--   上り（行き）グループ   -->
<!-- ========================= -->
<div class="group-up">

  <iframe src="https://bus-screenshot-akane.s3.ap-northeast-1.amazonaws.com/aka31_komone_to_koenji.html"></iframe>

    <iframe src="https://bus-screenshot-akane.s3.ap-northeast-1.amazonaws.com/tobus_komone_to_shinjuku.html"></iframe>

  <iframe src="https://bus-screenshot-akane.s3.ap-northeast-1.amazonaws.com/aka31_byoin_to_koenji.html"></iframe>

    <iframe src="https://bus-screenshot-akane.s3.ap-northeast-1.amazonaws.com/tobus_byoin_to_shinjuku.html"></iframe>


</div>

<!-- ========================= -->
<!--   下り（帰り）グループ   -->
<!-- ========================= -->
<div class="group-down">
  <iframe src="https://bus-screenshot-akane.s3.ap-northeast-1.amazonaws.com/aka31_nogata_to_komone.html"></iframe>

  <iframe src="https://bus-screenshot-akane.s3.ap-northeast-1.amazonaws.com/tobus_nogata_to_oji.html"></iframe>

    <iframe src="https://bus-screenshot-akane.s3.ap-northeast-1.amazonaws.com/aka31_koenji_to_komone.html"></iframe>
  
  <iframe src="https://bus-screenshot-akane.s3.ap-northeast-1.amazonaws.com/tobus_koenji_to_oji.html"></iframe>





</div>

</body>
</html>

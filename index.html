<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>バスモニター（茜）</title>

<style>
  body {
    font-family: "Rounded Mplus 1c", sans-serif;
    background: #f7f7ff;
    padding: 20px;
  }

  h1 {
    text-align: center;
    color: #555;
    margin-bottom: 10px;
  }

  #timestamp {
    text-align: center;
    color: #777;
    margin-bottom: 20px;
    font-size: 14px;
  }

  #refreshBtn {
    display: block;
    margin: 0 auto 20px auto;
    padding: 10px 20px;
    background: #8ea6ff;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(0,0,0,0.15);
  }

  /* PC・タブレット：2列 */
  #bus {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  /* スマホ：1列で4タイルが収まる高さに */
  @media (max-width: 600px) {
    #bus {
      grid-template-columns: 1fr;
    }
    .card {
      height: 115px;       /* ★スマホで4つ収まる高さ */
      padding: 12px;
      gap: 4px;
    }
    .from {
      font-size: 18px;     /* 左側のバス停名 */
    }
    .to {
      font-size: 14px;     /* 右側のバス停名 */
    }
    .time {
      font-size: 16px;     /* 時刻 */
    }
    .link a {
      font-size: 12px;     /* リンク */
    }
  }

  .card {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* 上り（上4つ）→ 青 */
  .card-up {
    border-left: 6px solid #8ea6ff;
  }

  /* 下り（下4つ）→ オレンジ */
  .card-down {
    border-left: 6px solid #ffb38e;
  }

  .from {
    font-size: 20px;
    font-weight: bold;
    color: #222;
    line-height: 1.3;
  }

  .to {
    font-size: 15px;
    color: #555;
  }

  .time {
    font-size: 18px;
    font-weight: bold;
    color: #444;
  }

  .link a {
    font-size: 14px;
    color: #6b7cff;
    text-decoration: none;
  }
</style>
</head>

<body>
<h1>🚌 バスモニター（茜）</h1>

<button id="refreshBtn">最新の情報に更新</button>

<div id="timestamp"></div>
<div id="bus"></div>

<script>
/* 並び順（1→8→2→7→3→5→4→6） */
const orderMap = [0, 7, 1, 6, 2, 4, 3, 5];

/* タイトル完全一致リンク */
const routeLinks = {
  "【国際興業バス：赤31】小茂根 → 高円寺":
    "https://transfer-cloud.navitime.biz/5931bus/approachings?departure-busstop=00020127&arrival-busstop=00020420",

  "【国際興業バス：赤31】武蔵野病院 → 高円寺":
    "https://transfer-cloud.navitime.biz/5931bus/approachings?departure-busstop=00020128&arrival-busstop=00020420",

  "【国際興業バス：赤31】野方二丁目 → 武蔵野病院/小茂根":
    "https://transfer-cloud.navitime.biz/5931bus/approachings?departure-busstop=00020422&arrival-busstop=00020127",

  "【国際興業バス：赤31】高円寺 → 武蔵野病院/小茂根":
    "https://transfer-cloud.navitime.biz/5931bus/approachings?departure-busstop=00020420&arrival-busstop=00020127",

  "【都営バス：王78】野方二丁目 → 王子駅方面(武蔵野病院/小茂根)":
    "https://tobus.jp/sp/blsys/stop?routecode=148&stopid=1203&poleno=2&ln=ja",

  "【都営バス：王78】高円寺 → 王子駅方面(武蔵野病院/小茂根)":
    "https://tobus.jp/sp/blsys/stop?routecode=148&stopid=478&poleno=2&ln=ja",

  "【都営バス：王78】武蔵野病院 → 新宿駅方面(高円寺)":
    "https://tobus.jp/sp/blsys/stop?routecode=148&stopid=1517&poleno=1&ln=ja",

  "【都営バス：王78】小茂根 → 新宿駅(高円寺)":
    "https://tobus.jp/sp/blsys/stop?routecode=148&stopid=555&poleno=1&ln=ja"
};

async function loadBus() {
  const url =
    "https://bus-screenshot-akane.s3.ap-northeast-1.amazonaws.com/latest.json?v=" +
    Date.now();

  const res = await fetch(url, { cache: "no-store" });
  const data = await res.json();

  document.getElementById("timestamp").textContent =
    "更新時刻: " + new Date(data.timestamp).toLocaleString("ja-JP");

  const box = document.getElementById("bus");
  box.innerHTML = "";

  /* 並び順を orderMap に従って並び替え */
  const sorted = orderMap.map(i => data.data[i]);

  sorted.forEach((line, index) => {
    const div = document.createElement("div");
    const [title, time] = line.split(":");

    /* タイトルを「左側 → 右側」に分解 */
    const match = title.match(/^(.*) → (.*)$/);
    let from = title;
    let to = "";
    if (match) {
      from = match[1];
      to = match[2];
    }

    /* 上4つ → 青、下4つ → オレンジ */
    div.className = index < 4 ? "card card-up" : "card card-down";

    const link = routeLinks[title] || "#";

    div.innerHTML = `
      <div class="title">
        <span class="from">${from}</span><br>
        <span class="to">→ ${to}</span>
      </div>
      <div class="time">${time}</div>
      <div class="link"><a href="${link}" target="_blank">▶ この路線の詳細を見る</a></div>
    `;

    box.appendChild(div);
  });
}

document.getElementById("refreshBtn").onclick = loadBus;

loadBus();
setInterval(loadBus, 60000);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>バスモニター（茜）</title>
<style>
  body {
    font-family: "Rounded Mplus 1c", sans-serif;
    background: #f7f7ff;
    padding: 20px;
  }

  h1 {
    text-align: center;
    color: #555;
    margin-bottom: 10px;
  }

  #timestamp {
    text-align: center;
    color: #777;
    margin-bottom: 20px;
    font-size: 14px;
  }

  #refreshBtn {
    display: block;
    margin: 0 auto 20px auto;
    padding: 10px 20px;
    background: #8ea6ff;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(0,0,0,0.15);
  }

  #refreshBtn:active {
    opacity: 0.7;
  }

  .card {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
  }

  /* 国際興業バス（赤31） → 青系 */
  .card-kokusai {
    border-left: 6px solid #8ea6ff;
  }

  /* 都営バス（王78） → オレンジ系 */
  .card-toei {
    border-left: 6px solid #ffb38e;
  }

  .title {
    font-size: 18px;
    font-weight: bold;
    color: #333;
    margin-bottom: 6px;
  }

  .time {
    font-size: 20px;
    color: #444;
    font-weight: bold;
  }

  .link {
    margin-top: 8px;
    font-size: 14px;
  }

  .link a {
    color: #6b7cff;
    text-decoration: none;
  }

  .link a:hover {
    text-decoration: underline;
  }
</style>
</head>

<body>
<h1>🚌 バスモニター（茜）</h1>

<button id="refreshBtn">最新の情報に更新</button>

<div id="timestamp"></div>
<div id="bus"></div>

<script>
/* 路線リンク（タイトル完全一致ではなく部分一致で判定する） */
function getRouteLink(title) {
  // 国際興業バス（赤31）
  if (title.includes("国際興業バス")) {
    if (title.includes("小茂根")) {
      return "https://transfer-cloud.navitime.biz/5931bus/approachings?departure-busstop=00020127&arrival-busstop=00020420";
    }
    if (title.includes("武蔵野病院")) {
      return "https://transfer-cloud.navitime.biz/5931bus/approachings?departure-busstop=00020128&arrival-busstop=00020420";
    }
    if (title.includes("野方二丁目")) {
      return "https://transfer-cloud.navitime.biz/5931bus/approachings?departure-busstop=00020422&arrival-busstop=00020128";
    }
  }

  // 都営バス（王78）
  if (title.includes("都営バス")) {
    if (title.includes("野方二丁目")) {
      return "https://tobus.jp/sp/blsys/stop?routecode=148&stopid=1203&poleno=2&ln=ja";
    }
    if (title.includes("高円寺")) {
      return "https://tobus.jp/sp/blsys/stop?routecode=148&stopid=478&poleno=2&ln=ja";
    }
  }

  return "#"; // 万が一一致しない場合
}

async function loadBus() {
  const url = "https://bus-screenshot-akane.s3.ap-northeast-1.amazonaws.com/latest.json?v=" + Date.now();
  const res = await fetch(url, { cache: "no-store" });
  const data = await res.json();

  document.getElementById("timestamp").textContent =
    "更新時刻: " + new Date(data.timestamp).toLocaleString("ja-JP");

  const box = document.getElementById("bus");
  box.innerHTML = "";

  data.data.forEach(line => {
    const div = document.createElement("div");
    const [title, time] = line.split(":");

    // 色分け
    if (title.includes("国際興業バス")) {
      div.className = "card card-kokusai";
    } else {
      div.className = "card card-toei";
    }

    const link = getRouteLink(title);

    div.innerHTML = `
      <div class="title">${title}</div>
      <div class="time">${time}</div>
      <div class="link"><a href="${link}" target="_blank">▶ この路線の詳細を見る</a></div>
    `;

    box.appendChild(div);
  });
}

document.getElementById("refreshBtn").onclick = loadBus;

loadBus();
setInterval(loadBus, 60000);
</script>

</body>
</html>
